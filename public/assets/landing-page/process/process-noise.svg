<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140">
  <filter id="noise">
    <feTurbulence
      type="fractalNoise"
      baseFrequency="0.85"
      numOctaves="3"
      stitchTiles="stitch"
    />
    <feColorMatrix type="saturate" values="0" />
    <feComponentTransfer>
      <feFuncA type="table" tableValues="0 0.7" />
    </feComponentTransfer>
  </filter>
  <rect width="140" height="140" filter="url(#noise)" opacity="0.28" />
</svg>
